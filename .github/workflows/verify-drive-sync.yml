name: verify-drive-sync
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/drive-r2-sync.mjs"
      - "package.json"
      - ".github/workflows/verify-drive-sync.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: DRIVE_FOLDER_ID=1N89122U-CkODfdpaza4sD2bPDxiXd_Br node scripts/drive-r2-sync.mjs
