name: deploy-discord-digital-delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-digital-delivery-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve Cloudflare account ID
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          response="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
          account_id="$(printf '%s' "$response" | jq -er '.result | if length == 1 then .[0].id else error("Token must access exactly one Cloudflare account") end')"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Create or reuse D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          set -euo pipefail
          list="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          database_id="$(printf '%s' "$list" | jq -r '.result[] | select(.name == "discord-digital-delivery") | .uuid' | head -n 1)"
          if [ -z "$database_id" ]; then
            created="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --request POST --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" --data '{"name":"discord-digital-delivery"}')"
            database_id="$(printf '%s' "$created" | jq -er '.result.uuid')"
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Create or reuse R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4.38.0 r2 bucket create discord-digital-products 2>&1)" || status=$?
          if [ "${status:-0}" -ne 0 ] && ! printf '%s' "$output" | grep -Eqi 'already exists|already in use'; then
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"

      - name: Inject generated D1 binding
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          sed "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml > wrangler.generated.toml

      - name: Apply D1 schema and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.38.0 d1 execute discord-digital-delivery --remote --file=./migrations/0001_orders.sql --config=./wrangler.generated.toml
          npx --yes wrangler@4.38.0 deploy --config=./wrangler.generated.toml

      - name: Register Discord slash commands
        env:
          DISCORD_APPLICATION_ID: "1542748509034389626"
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: "1542767815897915452"
        run: |
          set -euo pipefail
          test -n "$DISCORD_BOT_TOKEN"
          node ./scripts/register-commands.mjs

      - name: Configure Discord interaction verification key
        if: ${{ secrets.DISCORD_APPLICATION_PUBLIC_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_APPLICATION_PUBLIC_KEY: ${{ secrets.DISCORD_APPLICATION_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$DISCORD_APPLICATION_PUBLIC_KEY" | npx --yes wrangler@4.38.0 secret put DISCORD_APPLICATION_PUBLIC_KEY --config=./wrangler.generated.toml

      - name: Verify public health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 3 --retry-all-errors "https://discord-digital-deriver.n-yu1791.workers.dev/healthz" | jq -e '.ok == true'
